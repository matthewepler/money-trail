services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: money_trail
      POSTGRES_PASSWORD: money_trail
      POSTGRES_DB: money_trail
    ports:
      - '5432:5432'
    volumes:
      - money-trail-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U money_trail']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  money-trail-pg:
